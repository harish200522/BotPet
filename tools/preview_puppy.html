<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Golden Retriever Puppy Companion — Rig & Action Preview</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      min-height: 100vh;
      background: radial-gradient(circle at 50% 20%, #1e2230 0%, #0d1117 100%);
      color: #e6edf3;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      text-align: center;
      margin-bottom: 24px;
    }
    .header h1 {
      margin: 0 0 8px;
      font-size: 26px;
      color: #f6c177;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .header p {
      margin: 0;
      color: #8b949e;
      font-size: 14px;
    }
    .card {
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(240, 246, 252, 0.1);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(12px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 680px;
    }
    .stage-box {
      width: 320px;
      height: 240px;
      background: rgba(13, 17, 23, 0.95);
      border: 1px solid #30363d;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    #stageSvg {
      width: 100%;
      height: 100%;
      pointer-events: all;
      cursor: pointer;
    }
    .bubble {
      position: absolute;
      top: 16px;
      left: 50%;
      transform: translateX(-50%);
      background: #ffffff;
      color: #1a1a24;
      padding: 7px 14px;
      border-radius: 14px;
      font-size: 12px;
      font-weight: 600;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      white-space: nowrap;
      transition: opacity 0.3s ease, transform 0.3s ease;
      z-index: 10;
    }
    .bubble::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 50%;
      transform: translateX(-50%);
      border-width: 6px 6px 0;
      border-style: solid;
      border-color: #ffffff transparent transparent;
    }
    .bubble.hidden {
      opacity: 0;
      transform: translateX(-50%) translateY(6px);
    }
    .btn-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      margin-top: 20px;
    }
    button {
      background: #21262d;
      border: 1px solid #30363d;
      color: #c9d1d9;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    button:hover {
      background: #30363d;
      color: #ffffff;
      border-color: #8b949e;
    }
    button.active {
      background: #c86d38;
      border-color: #e58d52;
      color: #ffffff;
      box-shadow: 0 0 12px rgba(200, 109, 56, 0.4);
    }
    .controls-row {
      display: flex;
      gap: 16px;
      width: 100%;
      margin-top: 16px;
      justify-content: space-between;
      align-items: center;
    }
    .speed-slider {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      color: #8b949e;
      flex: 1;
    }
    .speed-slider input {
      flex: 1;
      accent-color: #c86d38;
    }
    .quote-box {
      margin-top: 16px;
      width: 100%;
      padding: 12px 16px;
      background: rgba(200, 109, 56, 0.1);
      border: 1px solid rgba(200, 109, 56, 0.3);
      border-radius: 8px;
      font-size: 13px;
      color: #f6c177;
      text-align: center;
      font-weight: 500;
    }
    .status-badge {
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 12px;
      background: #238636;
      color: #fff;
      font-weight: 600;
      margin-left: 8px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🐶 Biscuit — Golden Retriever Puppy <span class="status-badge">Disney 3/4 Style</span></h1>
    <p>Faithful Golden Retriever vector rig with natural 3/4 stance, expressive amber eyes, and organic trot walk cycle</p>
  </div>

  <div class="card">
    <div class="stage-box">
      <div id="bubble" class="bubble hidden">Woof woof! 🐶🐾</div>
      <svg id="stageSvg" viewBox="0 0 200 150" aria-label="Puppy Companion Scene">
        <!-- Ground Line Indicator -->
        <line x1="0" y1="137" x2="200" y2="137" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="4,4" />
      </svg>
    </div>

    <div class="quote-box" id="quoteText">
      "Woof! I'm ready to keep you company and guard your focus! 🐶✨"
    </div>

    <div class="btn-grid">
      <button class="active" onclick="switchState('sit', this)">🪑 Sit (Grounded)</button>
      <button onclick="switchState('walk', this)">🐾 Walk (Gait)</button>
      <button onclick="switchState('pat', this)">💖 Pat / Pet</button>
      <button onclick="switchState('sleep', this)">💤 Sleep</button>
      <button onclick="switchState('angry', this)">⚡ Angry / Scold</button>
      <button onclick="switchState('bored', this)">🥱 Bored (Yawn)</button>
      <button onclick="triggerWag(this)">🐕 Happy Tail Wag</button>
      <button onclick="triggerShake(this)">💫 Full Body Shake</button>
      <button onclick="triggerSwipe(this)">🐾 Swipe / Swat</button>
      <button onclick="toggleFacing(this)">↔️ Flip Facing</button>
    </div>

    <div class="controls-row">
      <div class="speed-slider">
        <label for="speedRange">Speed: <span id="speedVal">1.0x</span></label>
        <input type="range" id="speedRange" min="0.4" max="2.5" step="0.1" value="1.0" oninput="updateSpeed(this.value)" />
      </div>
      <button onclick="triggerRandomQuote()">💬 Talk to Puppy</button>
    </div>
  </div>

  <!-- Scripts -->
  <script src="../js/character-manager.js"></script>
  <script src="../js/puppy-data.js"></script>
  <script src="../js/puppy-rig.js"></script>

  <script>
    let facing = 1;
    let bubbleTimeout = null;

    window.addEventListener('DOMContentLoaded', () => {
      const svg = document.getElementById('stageSvg');
      if (window.PuppyRig) {
        PuppyRig.mount(svg);
        PuppyRig.setState('sit');
      }

      svg.addEventListener('click', () => {
        if (window.PuppyRig) {
          PuppyRig.pat();
          showBubble(CharacterManager.getQuote('pat'));
        }
      });
    });

    function switchState(st, btn) {
      document.querySelectorAll('.btn-grid button').forEach(b => b.classList.remove('active'));
      if (btn) btn.classList.add('active');
      if (window.PuppyRig) {
        PuppyRig.setState(st);
        showBubble(CharacterManager.getQuote('state', st));
      }
    }

    function triggerSwipe(btn) {
      if (window.PuppyRig) {
        PuppyRig.swipe();
        showBubble(CharacterManager.getQuote('angry') || 'Woof! *paws at screen* 🐾');
      }
    }

    function triggerWag(btn) {
      if (window.CharacterManager) {
        CharacterManager.wag();
        showBubble("Biscuit's tail is going a mile a minute! 🐶🐾");
      }
    }

    function triggerShake(btn) {
      if (window.CharacterManager) {
        CharacterManager.shake();
        showBubble("Shake, shake! Fluffy ears flying everywhere. 🐶✨");
      }
    }

    function toggleFacing(btn) {
      facing = facing === 1 ? -1 : 1;
      if (window.PuppyRig) {
        PuppyRig.setFacing(facing);
      }
    }

    function updateSpeed(val) {
      document.getElementById('speedVal').innerText = val + 'x';
      if (window.PuppyRig) {
        PuppyRig.setSpeed(parseFloat(val));
      }
    }

    function showBubble(text) {
      if (!text) return;
      const bubble = document.getElementById('bubble');
      const quoteBox = document.getElementById('quoteText');
      
      bubble.innerText = text;
      bubble.classList.remove('hidden');
      quoteBox.innerText = `"${text}"`;

      if (bubbleTimeout) clearTimeout(bubbleTimeout);
      bubbleTimeout = setTimeout(() => {
        bubble.classList.add('hidden');
      }, 3500);
    }

    function triggerRandomQuote() {
      const types = ['greeting', 'pat', 'break', 'focusStart', 'sit'];
      const pick = types[Math.floor(Math.random() * types.length)];
      showBubble(CharacterManager.getQuote(pick));
    }
  </script>
</body>
</html>
